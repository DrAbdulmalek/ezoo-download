# Ezoo Download — Linux Flatpak bundles (x86_64 + aarch64)
#
# Manually:  Actions → Linux Flatpak build → Run workflow
# On a tag:  pushing a tag like v1.0.7-linux also attaches the .flatpak
#            bundles for both architectures to that tag's GitHub Release.
#
# The bundles are self-contained (ffmpeg + aria2 + yt-dlp inside the sandbox),
# installable with:  flatpak install --user ./ezoo-download-*.flatpak

name: Linux Flatpak build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*-linux*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            flatpak flatpak-builder elfutils

      - name: Prepare Flathub runtime (Platform + Sdk)
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive \
            flathub org.freedesktop.Platform//24.08 \
                    org.freedesktop.Sdk//24.08

      - name: Build (flatpak-builder)
        run: |
          # Stripping is disabled inside the manifest (build-options:
          # strip/no-debuginfo) — flatpak-builder's eu-strip pass corrupts
          # rustc's bundled libLLVM otherwise.
          flatpak-builder --user --force-clean \
            --install-deps-from=flathub \
            --state-dir=.flatpak-builder --repo=repo \
            build packaging/flatpak/com.ezoo.Download.yml

      - name: Export .flatpak bundle + checksum
        run: |
          ver="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          name="ezoo-download-${ver}-linux-${{ matrix.arch }}.flatpak"
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "$name" com.ezoo.Download stable
          sha256sum "$name" | tee "$name.sha256"
          echo "BUNDLE=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ezoo-download-flatpak-${{ matrix.arch }}
          path: |
            *.flatpak
            *.flatpak.sha256
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to the tag's release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.flatpak
            dist/*.flatpak.sha256
          fail_on_unmatched_files: true
